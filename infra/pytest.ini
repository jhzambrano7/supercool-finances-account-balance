[pytest]
# A separate config file, not a `[tool.pytest.ini_options]` section in the root `pyproject.toml`:
# pytest climbs from the invocation directory looking for the first ini file it finds and then
# stops, so running `pytest` from `infra/` picks this one up instead of inheriting the service's
# `testpaths`, `asyncio_mode` and `integration` marker -- none of which mean anything for a CDK
# app that has no event loop and no database.
#
# `pythonpath = .` is the pytest-native replacement for the `cd infra && ...` dance the
# `mypy-infra` pre-commit hook does: `stacks.*` and `runtime.*` only import with `infra/` itself
# on `sys.path` (see `pyproject.toml`'s `exclude = ["^infra/"]` for mypy, for the same reason).
pythonpath = .
testpaths = tests
addopts = -q --strict-markers --strict-config
